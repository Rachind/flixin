name: Build FlixIn APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to publish the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLIXIN_BUILD: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Stamp build number into the game
        run: |
          printf '"use strict";\n\n/* ---------------- Build version ---------------- */\nconst APP_BUILD = %s;\n' "$FLIXIN_BUILD" > www/js/version.js

      - name: Sync Capacitor (copy www into the native project)
        run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set — without a fixed key updates can't install over the old app."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flixin.jks"
          echo "FLIXIN_KEYSTORE=$RUNNER_TEMP/flixin.jks" >> "$GITHUB_ENV"

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build signed APK
        working-directory: android
        env:
          FLIXIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLIXIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLIXIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/flixin.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flixin-apk
          path: ${{ runner.temp }}/flixin.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FlixIn #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ runner.temp }}/flixin.apk
